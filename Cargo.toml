[package]
authors = ["hypnguyen1209 <hypnguyen1209@gmail.com>"]
name = "rustad"
description = "Active Directory collector, analyzer and Kerberos toolkit."
keywords = ["bloodhound", "pentest", "ldap", "kerberos", "active-directory"]
repository = "https://github.com/hypnguyen1209/RustAD"
homepage = "https://github.com/hypnguyen1209/RustAD"
version = "2.0.0"
edition = "2021"
license = "MIT"
readme = "README.md"
rust-version = "1.85"

[dependencies]
tokio = { version = "1.42.0", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
clap = "4.5.23"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
nom7 = { version = "7.0", package = "nom" }
colored = "2"
chrono = "0.4"
bitflags = "2.4.1"
regex = "1"
env_logger = "0.11"
log = "0.4"
lazy_static = "1.4.0"
indicatif = "0.17"
x509-parser = "0.16"
trust-dns-resolver = "0.23"
zip = { version = "4.2.0", default-features = false, features = ["deflate"] }
rpassword = "7.2"
ldap3 = { version = "0.12.1", default-features = false }
picky-krb = "=0.11.1"
picky = "=7.0.0-rc.17"
winreg = { version = "0.52", optional = true }
sha1 = "0.10"
quick-xml = "0.37"
once_cell = "1.19"
bincode = "2.0.1"
obfstr = "0.4.1"
rayon = "1.10"
mimalloc = "0.1"
futures = "0.3"
anyhow = "1"
smb2-client = "0.2.4"
dcerpc = "0.2.7"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
picky-asn1 = "0.10"
picky-asn1-der = "0.5"
ms-pac-forge = "0.1.3"
rand = "0.8"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-pemfile = "2"
rustls-pki-types = "1"
p12-keystore = "0.3"
petgraph = "0.7"
hmac = "0.12"
md-5 = "0.10"
digest = "0.10"

[features]
noargs = ["winreg"] # Only available for Windows
nogssapi = ["ldap3/tls-rustls-ring", "ldap3/ntlm"] # Used for linux_musl armv7 and macos compilation
default = ["ldap3/tls-rustls-ring", "ldap3/gssapi", "ldap3/ntlm"]

[profile.release]
opt-level = "z"
lto = true
strip = "symbols"
codegen-units = 1
panic = "abort"
overflow-checks = false
debug = false
debug-assertions = false
incremental = false
